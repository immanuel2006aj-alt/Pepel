<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – Pepel</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
    .contact-item { display: flex; align-items: center; gap: 16px; padding: 16px; background: #f8fafc; border-radius: var(--radius); transition: 0.2s; }
    .contact-item:hover { background: #f1f5f9; }
    .contact-item i { font-size: 28px; color: var(--primary); width: 40px; text-align: center; }
    .contact-item .info { display: flex; flex-direction: column; }
    .contact-item .info .label { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
    .contact-item .info .value { font-weight: 600; color: #0f172a; }
    @media (max-width: 768px) {
      .contact-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <div class="logo">Pepel<span>.</span></div>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="faq.html">FAQ</a></li>
        <li><a href="withdraw.html">Withdraw</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
      <div class="menu-toggle" id="mobileMenu"><i class="fas fa-bars"></i></div>
    </div>
  </nav>

  <div class="container" style="padding: 40px 0;">
    <h2>📬 Contact Us</h2>
    <p style="color: var(--text-muted);">We reply within 2‑4 hours. Reach out anytime.</p>
    <div class="contact-grid">
      <a href="mailto:support@pepel.com" class="contact-item" style="text-decoration:none; color:inherit;">
        <i class="fas fa-envelope"></i>
        <div class="info"><span class="label">Email</span><span class="value">support@pepel.com</span></div>
      </a>
      <a href="https://t.me/PepelBot" target="_blank" class="contact-item" style="text-decoration:none; color:inherit;">
        <i class="fab fa-telegram"></i>
        <div class="info"><span class="label">Telegram</span><span class="value">@PepelBot</span></div>
      </a>
      <a href="tel:+919876543210" class="contact-item" style="text-decoration:none; color:inherit;">
        <i class="fab fa-whatsapp"></i>
        <div class="info"><span class="label">WhatsApp</span><span class="value">+91 98765 43210</span></div>
      </a>
      <div class="contact-item" style="background: #f1f5f9; cursor: default;">
        <i class="fas fa-clock"></i>
        <div class="info"><span class="label">Response Time</span><span class="value">2‑4 hours</span></div>
      </div>
    </div>
  </div>

  <footer>
    <div class="container">
      <p>&copy; 2026 Pepel. Support: <a href="mailto:support@pepel.com">support@pepel.com</a></p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    document.getElementById('mobileMenu').addEventListener('click', function() {
      document.getElementById('navLinks').classList.toggle('active');
    });
  </script>
</body>
</html>
