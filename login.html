<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Pepel</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="container" style="max-width: 480px; margin: 80px auto;">
    <div class="card" style="text-align: center;">
      <h2 style="margin-bottom: 8px;">🔐 Login to Pepel</h2>
      <p style="color: var(--text-muted); margin-bottom: 24px;">Enter your Worker ID and Password</p>
      <form id="loginForm">
        <div style="text-align: left; margin-bottom: 16px;">
          <label style="font-weight: 600;">Worker ID</label>
          <input type="text" id="workerId" placeholder="e.g., W001" required style="width:100%; padding:12px; border:2px solid #e2e8f0; border-radius:40px; margin-top:4px;">
        </div>
        <div style="text-align: left; margin-bottom: 24px;">
          <label style="font-weight: 600;">Password</label>
          <input type="password" id="password" placeholder="••••••••" required style="width:100%; padding:12px; border:2px solid #e2e8f0; border-radius:40px; margin-top:4px;">
        </div>
        <button type="submit" class="btn-primary" style="width:100%;">Login</button>
        <div id="loginError" style="color: #ef4444; margin-top: 16px; min-height: 24px;"></div>
      </form>
      <p style="margin-top: 20px; font-size: 14px; color: var(--text-muted);">
        Don't have an account? Contact support.
      </p>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    (function() {
      // Ensure BACKEND_URL is available
      if (typeof BACKEND_URL === 'undefined') {
        // Fallback, but should be defined in script.js
        var BACKEND_URL = 'https://pepel-backend.onrender.com';
      }

      document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const workerId = document.getElementById('workerId').value.trim();
        const password = document.getElementById('password').value;
        const errorEl = document.getElementById('loginError');
        errorEl.textContent = '';

        if (!workerId || !password) {
          errorEl.textContent = 'Please fill in all fields.';
          return;
        }

        try {
          const response = await fetch(BACKEND_URL + '/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ workerId, password })
          });

          const data = await response.json();

          if (response.ok && data.token) {
            // Save token and workerId (functions from script.js)
            if (typeof setToken === 'function' && typeof setWorkerId === 'function') {
              setToken(data.token);
              setWorkerId(workerId);
            } else {
              // Fallback to localStorage directly
              localStorage.setItem('pepel_token', data.token);
              localStorage.setItem('pepel_worker_id', workerId);
            }
            // Redirect to dashboard
            window.location.href = 'dashboard.html';
          } else {
            errorEl.textContent = data.error || 'Invalid credentials. Please try again.';
          }
        } catch (err) {
          console.error('Login error:', err);
          errorEl.textContent = 'Network error. Check your internet connection.';
        }
      });
    })();
  </script>
</body>
</html>
