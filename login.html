<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Pepel</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #f8fafc 0%, #e2e8f0 100%);
      padding: 20px;
    }
    .login-card {
      background: white;
      border-radius: 32px;
      padding: 40px 36px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.06);
      animation: fadeUp 0.6s ease;
    }
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .login-card .brand {
      text-align: center;
      margin-bottom: 4px;
    }
    .login-card .brand i {
      font-size: 40px;
      color: var(--primary);
    }
    .login-card .brand h2 {
      font-size: 28px;
      font-weight: 700;
      color: #0f172a;
      margin: 4px 0 0;
    }
    .login-card .brand h2 span {
      color: var(--primary);
    }
    .login-card .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 15px;
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      color: #1e293b;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid #e2e8f0;
      border-radius: 40px;
      font-size: 16px;
      transition: 0.25s;
      background: #f8fafc;
    }
    .form-group input:focus {
      border-color: var(--primary);
      outline: none;
      background: white;
      box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.1);
    }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 40px;
      font-weight: 700;
      font-size: 17px;
      cursor: pointer;
      transition: 0.25s;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .login-btn:hover {
      background: var(--primary-dark);
    }
    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .login-btn .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top: 3px solid white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .login-btn.loading .spinner {
      display: inline-block;
    }
    .login-btn.loading .btn-text {
      display: none;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-area {
      margin-top: 14px;
      min-height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .status-badge {
      font-size: 13px;
      font-weight: 500;
      padding: 4px 16px;
      border-radius: 40px;
      display: none;
    }
    .status-badge.visible {
      display: inline-block;
    }
    .status-badge.idle {
      background: #f1f5f9;
      color: #64748b;
    }
    .status-badge.connecting {
      background: #fef3c7;
      color: #b45309;
    }
    .status-badge.success {
      background: #d1fae5;
      color: #065f46;
    }
    .status-badge.error {
      background: #fee2e2;
      color: #991b1b;
    }
    .error-msg {
      color: #ef4444;
      font-size: 14px;
      text-align: center;
      min-height: 20px;
    }
    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: #94a3b8;
    }
    .login-footer a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }
    @media (max-width: 480px) {
      .login-card { padding: 28px 20px; }
      .login-card .brand h2 { font-size: 24px; }
    }
  </style>
</head>
<body>
<div class="login-wrapper">
  <div class="login-card">
    <div class="brand">
      <i class="fas fa-brain"></i>
      <h2>Pepel<span>.</span></h2>
    </div>
    <p class="subtitle">Enter your credentials to start earning</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="workerId">Worker ID</label>
        <input type="text" id="workerId" placeholder="e.g., W001" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">
        <span class="spinner"></span>
        <span class="btn-text">Sign In</span>
      </button>

      <div class="status-area">
        <div id="statusBadge" class="status-badge idle">Ready</div>
        <div id="errorMsg" class="error-msg"></div>
      </div>
    </form>

    <div class="login-footer">
      Don't have an account? <a href="contact.html">Contact support</a>
    </div>
  </div>
</div>

<script>
  (function() {
    const BACKEND_URL = 'https://pepel-backend.onrender.com';

    const form = document.getElementById('loginForm');
    const workerIdInput = document.getElementById('workerId');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const statusBadge = document.getElementById('statusBadge');
    const errorMsg = document.getElementById('errorMsg');

    function setStatus(text, type) {
      statusBadge.textContent = text;
      statusBadge.className = 'status-badge visible ' + type;
    }

    function setError(text) {
      errorMsg.textContent = text;
    }

    function clearError() {
      errorMsg.textContent = '';
    }

    function setLoading(state) {
      if (state) {
        loginBtn.classList.add('loading');
        loginBtn.disabled = true;
        setStatus('Connecting…', 'connecting');
        clearError();
      } else {
        loginBtn.classList.remove('loading');
        loginBtn.disabled = false;
        setStatus('Ready', 'idle');
      }
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const workerId = workerIdInput.value.trim();
      const password = passwordInput.value;
      clearError();

      if (!workerId || !password) {
        setError('Please fill in all fields.');
        setStatus('Missing fields', 'error');
        return;
      }

      setLoading(true);

      try {
        const url = BACKEND_URL + '/api/login';
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ workerId, password })
        });

        const data = await response.json();

        if (response.ok && data.token) {
          localStorage.setItem('pepel_token', data.token);
          localStorage.setItem('pepel_worker_id', workerId);
          setStatus('✅ Success! Redirecting…', 'success');
          window.location.href = 'dashboard.html';
        } else {
          const msg = data.error || 'Invalid credentials.';
          setError(msg);
          setStatus('❌ Login failed', 'error');
        }
      } catch (err) {
        console.error('Login error:', err);
        setError('Network error. Please check your connection.');
        setStatus('⚠️ Network error', 'error');
      } finally {
        setLoading(false);
      }
    });

    workerIdInput.addEventListener('input', function() {
      if (this.value.length > 0 && passwordInput.value.length > 0) {
        setStatus('Ready to login', 'idle');
        clearError();
      }
    });
    passwordInput.addEventListener('input', function() {
      if (workerIdInput.value.length > 0 && this.value.length > 0) {
        setStatus('Ready to login', 'idle');
        clearError();
      }
    });
  })();
</script>
</body>
          </html>
