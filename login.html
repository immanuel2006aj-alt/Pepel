<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Pepel</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* Extra debug styling */
    #debugBox {
      margin-top: 16px;
      padding: 12px;
      background: #f3f4f6;
      border-radius: 8px;
      font-size: 13px;
      font-family: monospace;
      text-align: left;
      color: #1f2937;
      display: none;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    #debugBox.error {
      background: #fee2e2;
      color: #991b1b;
    }
    #debugBox.success {
      background: #d1fae5;
      color: #065f46;
    }
  </style>
</head>
<body>
  <div class="container" style="max-width: 480px; margin: 80px auto;">
    <div class="card" style="text-align: center;">
      <h2 style="margin-bottom: 8px;">🔐 Login to Pepel</h2>
      <p style="color: var(--text-muted); margin-bottom: 24px;">Enter your Worker ID and Password</p>
      <form id="loginForm">
        <div style="text-align: left; margin-bottom: 16px;">
          <label style="font-weight: 600;">Worker ID</label>
          <input type="text" id="workerId" placeholder="e.g., W003" required style="width:100%; padding:12px; border:2px solid #e2e8f0; border-radius:40px; margin-top:4px;">
        </div>
        <div style="text-align: left; margin-bottom: 24px;">
          <label style="font-weight: 600;">Password</label>
          <input type="password" id="password" placeholder="••••••••" required style="width:100%; padding:12px; border:2px solid #e2e8f0; border-radius:40px; margin-top:4px;">
        </div>
        <button type="submit" class="btn-primary" style="width:100%;">Login</button>
        <div id="loginError" style="color: #ef4444; margin-top: 16px; min-height: 24px;"></div>
        <div id="debugBox"></div>
      </form>
      <p style="margin-top: 20px; font-size: 14px; color: var(--text-muted);">
        Don't have an account? Contact support.
      </p>
    </div>
  </div>

  <script>
    (function() {
      // ============================================================
      // HARDCODED BACKEND URL – no external dependencies
      // ============================================================
      const BACKEND_URL = 'https://pepel-backend.onrender.com';

      const form = document.getElementById('loginForm');
      const workerIdInput = document.getElementById('workerId');
      const passwordInput = document.getElementById('password');
      const errorEl = document.getElementById('loginError');
      const debugBox = document.getElementById('debugBox');

      function setDebug(msg, type = 'info') {
        debugBox.style.display = 'block';
        debugBox.textContent = msg;
        debugBox.className = type;
      }

      form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const workerId = workerIdInput.value.trim();
        const password = passwordInput.value;
        errorEl.textContent = '';
        debugBox.style.display = 'none';

        if (!workerId || !password) {
          errorEl.textContent = 'Please fill in all fields.';
          return;
        }

        const url = BACKEND_URL + '/api/login';
        setDebug('⏳ Sending request to: ' + url + '\nPayload: ' + JSON.stringify({ workerId, password }), 'info');

        try {
          const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ workerId, password })
          });

          const data = await response.json();
          setDebug('✅ Status: ' + response.status + '\nResponse: ' + JSON.stringify(data, null, 2), 'success');

          if (response.ok && data.token) {
            // Save token and redirect
            localStorage.setItem('pepel_token', data.token);
            localStorage.setItem('pepel_worker_id', workerId);
            window.location.href = 'dashboard.html';
          } else {
            errorEl.textContent = data.error || 'Invalid credentials.';
            setDebug('❌ Error: ' + (data.error || 'Unknown error'), 'error');
          }
        } catch (err) {
          console.error('Login error:', err);
          errorEl.textContent = 'Network error. Check debug box.';
          setDebug('❌ Network error: ' + err.message + '\n\nPossible causes:\n- CORS blocking\n- Backend not reachable\n- Firewall/antivirus blocking\n- Wrong BACKEND_URL', 'error');
        }
      });
    })();
  </script>
</body>
</html>
